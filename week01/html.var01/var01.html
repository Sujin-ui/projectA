<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>간단한 퀴즈</title>

  <style>
    * { box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  margin: 0;
  background: #f6fbff;
  color: #222;
}
.container {
  max-width: 800px;
  margin: 40px auto;
  padding: 24px;i
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}
h1 { text-align: center; margin-bottom: 20px; }
.quiz { margin-bottom: 24px; }
.quiz h2 { font-size: 18px; margin-bottom: 10px; }
ul { list-style: none; padding: 0; margin: 0; }
.option {
  background: #eee;
  margin: 8px 0;
  padding: 10px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .25s, transform .08s;
}
.option:hover { background: #dff3ff; transform: translateY(-2px); }
.correct { background: #e6f7e6; }
</style>?

<link rel="stylesheet" href="style.css" />
  
</head>
<body>
  <div class="container">
    <h1>🌟 간단한 퀴즈</h1>

    <section class="quiz">
      <h2>1. 지구에서 가장 큰 대륙은?</h2>
      <ul>
        <li class="option">아프리카</li>
        <li class="option">유럽</li>
        <li class="option correct">아시아</li>
        <li class="option">남아메리카</li>
      </ul>
    </section>

    <section class="quiz">
      <h2>2. HTML에서 링크를 만들 때 사용하는 태그는?</h2>
      <ul>
        <li class="option">&lt;link&gt;</li>
        <li class="option correct">&lt;a&gt;</li>
        <li class="option">&lt;href&gt;</li>
        <li class="option">&lt;url&gt;</li>
      </ul>
    </section>

  </div>
</body>
</html>
